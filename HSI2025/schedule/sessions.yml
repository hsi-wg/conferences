  - id: ChairWelcome-workshop
    day: 1
    title: "Chair Welcome"
    authors: ["G. Kennedy"]
    chair: "GK"
    categories: [ "Plenary"]
    tags: ["A", "G"]
    start: 2025-11-05T18:45:00Z
    duration: PT30M
    abstract: |
      The INCOSE HSI Working Group welcomes participants to this year’s workshop, introducing the theme HSI Now: People, Practice and Potential. The session sets the tone for collaboration, emphasizing shared learning, exploration of current HSI practices, and collective efforts to shape the future of Human Systems Integration.
  - id: keynote-workshop
    day: 1
    title: "Complex Adaptive and Self-organising Systems"
    authors: ["Patrick Hoverstadt"]
    chair: "GK"
    categories: [ "Keynote"]
    tags: ["A", "G"]
    start: 2025-11-05T19:15:00Z
    duration: PT60M
    abstract: |
      Patrick Hoverstadt will explore how organisations function as complex adaptive systems, where people are not just components—but catalysts of transformation. Drawing on decades of experience with the Viable System Model and his work in The Grammar of Systems, Patrick will unpack how human agency, collaborative practice, and systemic awareness shape the potential of organisations to adapt, evolve, and thrive. This session will offer a compelling look at how embracing complexity, rather than resisting it, unlocks new possibilities for meaningful and sustainable change.
  
