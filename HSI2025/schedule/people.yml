    Bio: Dr. Smoker is a former air traffic controller with NATS, where he served for approximately 37 years in en-route and terminal operations at the London Air Traffic Control Centre and later as an en-route controller and supervisor at Swanwick Centre. While at Swanwick, he became Head of Operational Safety in 2006 and subsequently held additional safety management positions until 2015. From 2015 to 2024, he was a researcher in the Faculty of Engineering at Lund University, contributing to SESAR projects and collaborating with Swedish aviation authorities. His work addressed resilience in sociotechnical systems, safety management, cognitive systems engineering, and human-machine teaming. He also taught in Lund’s Human Factors and System Safety MSc program and remains active in IFATCA and EASA human factors associations.
