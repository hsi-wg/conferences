    Bio: Dr. Judi See is a Distinguished Member of Technical Staff at Sandia National Laboratories in Albuquerque, New Mexico, where she has worked as a systems analyst and human factors engineer since 2010. Previously, she worked as a Department of Defense contractor for 16 years, primarily supporting rapid acquisition for the Air Force. Dr. See has a doctorate in Experimental Psychology (Human Factors) and master’s degrees in Experimental Psychology (Human Factors) and Systems Engineering. She also has professional certification in human factors and ergonomics from the Board of Certification in Professional Ergonomics (BCPE). Dr. See has published research in the areas of vigilance, target detection, signal detection theory, visual inspection, mental workload, and human readiness levels. She is a senior editor for the Ergonomics in Design journal, chair of the Human Factors and Ergonomics Society (HFES) Representatives and Liaisons committee, and a member of the Foundation for Professional Ergonomics board of directors. Dr. See led research and maturation of the Human Readiness Levels (HRL) scale and associated ANSI/HFES 400-2021 standard. 
