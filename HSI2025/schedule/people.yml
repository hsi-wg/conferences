    Bio: Michael E. Miller is a Professor of Systems Engineering at the Air Force Institute of Technology. He teaches courses in human factors, human Human Agent Teaming, and Human Systems Integration. Prior to joining AFIT in 2010, Mike was a Human Factors Engineer at Eastman Kodak where he contributed to several products, including pioneering an OLED device architecture that was commercialized by LG Display in the first commercially available OLED television. Mike holds a PhD from Virginia Tech in Industrial and Systems Engineering. He is a member of the Human Factors and Ergonomics Society, the International Council on Systems Engineering, as well as a senior member of the Society for Information Display.  Mike has authored over 100 issued U.S. patents, more than 50 peer-reviewed journal articles, and 60 conference papers. He has recently coauthored a book entitled “Integrating Artificial and Human Intelligence through Agent Oriented Systems Design”, which was published by CRC Press. Additionally, he co-led a recent NATO Research Specialists meeting on “Human Digital Twin in the Military: Findings and Perspectives". 
