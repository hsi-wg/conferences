    Affiliations: NASEM
    Country: USA
    Bio: Dr. Emanuel Robinson is the Director of the Board on Human-Systems Integration at the National Academies of Sciences, Engineering, and Medicine. Dr. Robinson’s work spans human factors, industrial/organizational and cognitive psychology, and program evaluation. He has worked with a range of federal, state, private, and philanthropic organizations to successfully execute projects in decision-making strategies, transportation, technology design and human factors, organizational change and leadership, behavioral economics, and safety. Dr. Robinson has published in these areas and is regularly invited to speak at conferences and professional meetings. Prior to joining the Academies, he led the Center for Human Performance and Safety at a leading science research non-profit and was a Senior Study Director for Transportation Systems Management and Operations at a top behavioral research firm. Dr. Robinson received a B.S. from the University of New Orleans in Psychology, and an M.S. and Ph.D. in Experimental Psychology from the Georgia Institute of Technology.
